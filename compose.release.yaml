name: guanpan
services:
  update-manager:
    image: ghcr.io/${GHCR_REPOSITORY:-taotaomo/guanpan}-collector:${IMAGE_TAG:-latest}
    user: "0:0"
    command: [node, updateServer.mjs]
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.125
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - upgrade-data:/updates
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3003/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 4s
      start_period: 5s
  web:
    networks: [default, pine-internal]
    image: ghcr.io/${GHCR_REPOSITORY:-taotaomo/guanpan}-web:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:5188:80"
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.125
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
  collector:
    networks: [default, pine-internal]
    image: ghcr.io/${GHCR_REPOSITORY:-taotaomo/guanpan}-collector:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    environment:
      LIGHTER_NETWORK: ${LIGHTER_NETWORK:-mainnet}
      LIGHTER_ACCOUNT_INDEX: ${LIGHTER_ACCOUNT_INDEX:-}
      LIGHTER_API_KEY_INDEX: ${LIGHTER_API_KEY_INDEX:-4}
      LIGHTER_API_KEY_PRIVATE_KEY: ${LIGHTER_API_KEY_PRIVATE_KEY:-}
      LIGHTER_TRADING_ENABLED: ${LIGHTER_TRADING_ENABLED:-false}
      LIGHTER_MAX_ORDER_USDC: ${LIGHTER_MAX_ORDER_USDC:-10000}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-}
      BINANCE_READ_KEY: ${BINANCE_READ_KEY:-}
      BINANCE_READ_SECRET: ${BINANCE_READ_SECRET:-}
      OKX_READ_KEY: ${OKX_READ_KEY:-}
      OKX_READ_SECRET: ${OKX_READ_SECRET:-}
      OKX_READ_PASSPHRASE: ${OKX_READ_PASSPHRASE:-}
      BYBIT_READ_KEY: ${BYBIT_READ_KEY:-}
      BYBIT_READ_SECRET: ${BYBIT_READ_SECRET:-}
    volumes:
      - liquidation-data:/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  pine-engine:
    image: ghcr.io/${GHCR_REPOSITORY:-taotaomo/guanpan}-pine-engine:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 1152m
    memswap_limit: 1152m
    cpus: 1.5
    networks: [pine-internal]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
networks:
  pine-internal:
    internal: true
volumes:
  upgrade-data:
  liquidation-data:
