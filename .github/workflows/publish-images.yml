name: 发布已构建的镜像
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 发布标签，留空使用最新发布
        required: false
        default: ''
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 下载发布页镜像包并验证
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.oci.tar' --pattern 'SHA256SUMS'
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.oci.tar' --pattern 'SHA256SUMS'
          fi
          sha256sum --check SHA256SUMS
      - name: 复用公共基础层并逐层校验完整镜像
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, re, tarfile, urllib.request, urllib.error
          for component in ('web','collector','pine-engine'):
              root=pathlib.Path('oci-'+component)
              root.mkdir(exist_ok=True)
              with tarfile.open('guanpan-'+component+'.oci.tar') as archive:
                  for member in archive.getmembers():
                      if member.name not in ('oci-layout','index.json','blobs','blobs/sha256') and not re.fullmatch(r'blobs/sha256/[a-f0-9]{64}',member.name):
                          raise ValueError('Unexpected OCI member')
                      if not member.isfile() and not member.isdir(): raise ValueError('Unexpected OCI file type')
                  archive.extractall(root,filter='data')
              repo='taotaomo/guanpan-'+component
              with urllib.request.urlopen('https://ghcr.io/token?service=ghcr.io&scope=repository:'+repo+':pull') as response:
                  token=json.load(response)['token']
              with urllib.request.urlopen('https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/node:pull',timeout=30) as response:
                  base_token=json.load(response)['token']
              def blob(descriptor):
                  digest=descriptor['digest']
                  if not re.fullmatch(r'sha256:[a-f0-9]{64}',digest): raise ValueError('Invalid digest')
                  path=root/'blobs'/'sha256'/digest[7:]
                  if not path.exists():
                      sources=[('https://ghcr.io/v2/'+repo+'/blobs/'+digest,token),('https://registry-1.docker.io/v2/library/node/blobs/'+digest,base_token)]
                      for address,read_token in sources:
                          request=urllib.request.Request(address,headers={'Authorization':'Bearer '+read_token})
                          try:
                              with urllib.request.urlopen(request,timeout=120) as response:
                                  path.write_bytes(response.read())
                              break
                          except urllib.error.HTTPError as error:
                              if error.code not in (403,404): raise
                      if not path.exists(): raise ValueError('Missing public image layer')
                  data=path.read_bytes()
                  if hashlib.sha256(data).hexdigest()!=digest[7:]:raise ValueError('Image digest mismatch')
                  return data
              def complete(descriptor):
                  value=json.loads(blob(descriptor))
                  if 'manifests' in value:
                      for item in value['manifests']: complete(item)
                  else:
                      blob(value['config'])
                      for layer in value.get('layers',[]): blob(layer)
              for descriptor in json.loads((root/'index.json').read_text())['manifests']: complete(descriptor)
              print(component+' complete image verified')
          PY
      - name: 安装镜像传输工具
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: 将三个镜像同步至 GHCR
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          for component in web collector pine-engine; do
            skopeo copy --all --dest-creds "$REGISTRY_USER:$REGISTRY_TOKEN" "oci:oci-$component" "docker://ghcr.io/taotaomo/guanpan-$component:latest"
          done
