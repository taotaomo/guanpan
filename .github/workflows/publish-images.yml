name: 发布已构建的镜像
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 已上传镜像的发布版本
        required: true
        default: v0.2.0
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 下载发布页镜像包并验证
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.oci.tar' --pattern 'SHA256SUMS'
          sha256sum --check SHA256SUMS
      - name: 安装镜像传输工具
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: 将三个镜像同步至 GHCR
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          for component in web collector pine-engine; do
            skopeo copy --all --dest-creds "$REGISTRY_USER:$REGISTRY_TOKEN" "oci-archive:guanpan-$component.oci.tar" "docker://ghcr.io/taotaomo/guanpan-$component:latest"
          done
